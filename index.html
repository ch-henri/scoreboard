<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="/images/favicon/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/images/favicon/192x192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="/images/favicon/48x48.png" sizes="48x48" type="image/png">


  <!-- Use by iphone and ipad homescreen -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"><!-- 180×180 -->

  <link rel="stylesheet" href="/resources/css/main.css">
  <script type="module" src="/resources/js/main.js"></script>
  <title>Judo Scoreboard</title>

</head>

<body  x-data="scoreboard" class="h-screen relative flex flex-col font-medium text-black tabular-nums">

    <!-- Opponent 1 -->
    <div class="flex-1 bg-gray-100 grid md:grid-cols-2 gap-x-6">
      <div class="grid place-items-center">
        <div class="fs-name font-bold uppercase max-md:text-center tracking-wider min-w-24" contenteditable="true" spellcheck="false">Blanc</div>
      </div>
      <div class="flex items-center justify-around gap-x-4 lg:gap-x-12">
        <button @click="scoreIppon($el)" data-ippon="white" class="font-score fs-score">0</button>

        <div class="relative z-10">
          <button @click="scoreWazaari($el)" data-wazaari="white" class="font-score fs-score" x-text="wazaari.white != 1 ? '0' : '1' ">0</button>
          <button @click="wazaari.white = 0" class="invisible delete-score" :class="{'!visible' : wazaari.white == 1}">
            <span class="sr-only">Delete waza-ari</span>
            <svg class="text-gray-500 bg-gray-50 rounded-full h-8 w-8 lg:h-12 lg:w-12 mt-1 lg:mt-3 p-2 lg:p-4" fill="currentColor" width="16" height="16" width="16" height="16" viewBox="0 0 16 16">
              <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z" />
            </svg>
          </button>
        </div>

        <div class="relative z-10">
          <button data-shido="white" @click="addShido($el)" x-ref="shidoWhite" class="bg-yellow-500 text-black">
            <span class="block font-score fs-score m-[0.15em]">0</span>
          </button>
          <button @click="deleteShido($refs.shidoWhite)" class="invisible delete-score" :class="{'!visible' : shidoCounter.white > 0}">
            <span class="sr-only">Delete shido</span>
            <svg class="text-gray-500 bg-gray-50 rounded-full h-8 w-8 lg:h-12 lg:w-12 mt-1 lg:mt-3 p-2 lg:p-4" fill="currentColor" width="16" height="16" viewBox="0 0 16 16">
              <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Opponent 2 -->
    <div class="flex-1 bg-primary text-white grid md:grid-cols-2 gap-x-6">
      <div class="grid place-items-center">
        <div class="fs-name font-bold uppercase max-md:text-center tracking-wider min-w-24" contenteditable="true" spellcheck="false" x-text="accentColor === 'blue' ? 'Bleu' : 'Rouge'">Bleu</div>
      </div>
      <div class="flex items-center justify-around gap-x-4 lg:gap-x-12">
        <button @click="scoreIppon($el)" data-ippon="blue" class="font-score fs-score">0</button>
        
        <div class="relative z-20">
          <button @click="scoreWazaari($el)" data-wazaari="blue" class="font-score fs-score" x-text="wazaari.blue != 1 ? '0' : '1' ">0</button>
          <button @click="wazaari.blue = 0" class="invisible delete-score" :class="{'!visible' : wazaari.blue == 1}">
            <span class="sr-only">Delete waza-ari</span>
            <svg class="text-gray-50 bg-gray-50/25 rounded-full h-8 w-8 lg:h-12 lg:w-12 mt-1 lg:mt-3 p-2 lg:p-4" fill="currentColor" width="16" height="16" viewBox="0 0 16 16">
              <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z" />
            </svg>
          </button>
        </div>

        <div class="relative z-20">
          <button data-shido="blue" @click="addShido($el)" x-ref="shidoBlue" class="bg-yellow-500">
            <span class="block font-score fs-score m-[0.15em]">0</span>
          </button>
            <button @click="deleteShido($refs.shidoBlue)" class="invisible delete-score" :class="{'!visible' : shidoCounter.blue > 0}">
              <span class="sr-only">Delete shido</span>
              <svg class="text-gray-50 bg-gray-50/25 rounded-full h-8 w-8 lg:h-12 lg:w-12 mt-1 lg:mt-3 p-2 lg:p-4" fill="currentColor" width="16" height="16" viewBox="0 0 16 16">
                <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z" />
              </svg>
            </button>
        </div>
      </div>
    </div>

  <!-- Time section -->
  <div :class="{'showOsaekomi' : osaekomiActive}" class="h-[32%] grid hideOsaekomi bg-neutral-900 text-neutral-200 px-8">
        
    <!-- Main timer -->
    <div class="h-full grid place-items-center sm:order-2" x-transition>
      <div class="place-self-center">
        <button @click="isRunning ? mate : ajime" :class="{'text-green-600': isRunning }" :disabled="timeLeft === 0 && !goldenScore" class="fs-timer font-score font-bold">
          <span id="timer">00:00</span>
        </button>
      </div>
    </div>

    <!-- Osaekomi timer -->
    <div class="h-full grid place-items-center">
        <div style="display:none" x-show="osaekomiActive" class="grid items-center">
          <div class="grid grid-cols-2">
            <form action="" class="flex flex-col -mr-px">
              <label for="osaekomi-white" :class="{'animate-pulse' : !osaekomiColor}" class="fs-osaekomi-label text-gray-300 font-bold uppercase text-center border-2 border-white/25 cursor-pointer has-[:checked]:text-white has-[:checked]:bg-black has-[:checked]:border-white py-0.5 lg:py-5">
                <span>Blanc</span>
                <input type="radio" id="osaekomi-white" class="hidden" name="color" value="white" x-model="osaekomiColor" data-osaekomiColor="white" autocomplete="off" />
              </label>
              <label for="osaekomi-blue" :class="{'animate-pulse' : !osaekomiColor}" class="fs-osaekomi-label text-primary font-bold uppercase text-center border-2 border-white/25 cursor-pointer has-[:checked]:bg-primary has-[:checked]:border-primary  has-[:checked]:text-white py-2 lg:py-5">
                <span x-text="accentColor === 'blue' ? 'Bleu' : 'Rouge' ">Bleu</span>
                <input type="radio" id="osaekomi-blue" class="hidden" name="color" value="blue" x-model="osaekomiColor" data-osaekomiColor="blue" autocomplete="off" />
              </label>
            </form>
            <button 
              @click="osaekomiIsPaused = !osaekomiIsPaused" 
              :class="{ '!border-white' : osaekomiColor === 'white', '!border-primary' : osaekomiColor === 'blue'}" 
              class="relative grid place-items-center h-full text-white border-2 border-white/25 px-2 lg:px-5"
            >
              <div :class="{'opacity-25' : osaekomiIsPaused}" id="osaekomiTimer" class="fs-osaekomi leading-none">00</div>
              <div class="absolute inset-0 grid place-items-center">
                <div x-show="osaekomiIsPaused">
                  <svg class="block h-6 w-6 lg:h-12 lg:w-12" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M16 8A8 8 0 110 8a8 8 0 0116 0M6.25 5C5.56 5 5 5.56 5 6.25v3.5a1.25 1.25 0 102.5 0v-3.5C7.5 5.56 6.94 5 6.25 5m3.5 0c-.69 0-1.25.56-1.25 1.25v3.5a1.25 1.25 0 102.5 0v-3.5C11 5.56 10.44 5 9.75 5" />
                  </svg>
                </div>
              </div>
            </button>
          </div>
          <button x-show="osaekomiActive" @click="toketa($el)" class="self-start md:text-lg lg:text-2xl font-bold text-red-400 mt-1 lg:mt-4">TOKETA</button>
        </div>

        <button :class="{'!block' : !osaekomiActive && (timeLeft !== 0)}" @click="osaekomi($el)" class="hidden md:text-lg lg:text-2xl font-bold text-gray-400 mt-auto mb-6">OSAEKOMI</button>
        <button :class="{'!block' : timeLeft === 0 && !goldenScore}" @click="goldenScore = true" class="hidden md:text-lg lg:text-2xl font-bold text-yellow-600 mt-auto mb-6">GOLDEN SCORE</button>
    </div>

    <!-- Reset -->
    <div class="absolute right-0 bottom-0 m-2 p-2">
      <button @click="reset" :class="{'!visible' : !isRunning && (fightDuration != timeLeft)}" class="invisible md:text-lg lg:text-xl text-red-300">RESET</button>
    </div>

    <!-- Modal -->
    <button @click="fillDialog" x-show="fightDuration === timeLeft" type="button" id="triggerDialog" class="absolute right-0 bottom-0 border-0 bg-gray-50 rounded-full text-gray-500 hover:bg-gray-100 m-6 p-2">
      <span class="sr-only">Open modal</span>
      <svg width="20" height="20" fill="currentColor" class="bi bi-gear-fill" width="16" height="16" viewBox="0 0 16 16">
        <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z" />
      </svg>
    </button>
    <dialog id="dialog" class="w-full max-w-xl p-0">
      <div id="dialogInner" class="p-2 sm:p-4 md:p-8 mx-3">
        <button type="button" class="block absolute top-0 right-0 text-gray-400 hover:text-gray-800 m-2 p-1" id="closeDialogBtn">
          <span class="sr-only"></span>
          <svg width="30" height="30" fill="currentColor" class="bi bi-x-circle-fill" width="16" height="16" viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293z" />
          </svg>
        </button>
        <form action="" @submit.prevent="paramUpdate">
          <h2 class="fs-modal-title mb-2">Durée du combat</h2>

          <div class="flex flex-col sm:flex-row gap-x-6 gap-y-4">
            <div class="flex-1 grid gap-y-2">
              <label for="minutes" class="">Minutes</label>
              <div class="h-14 grid grid-cols-3 border border-black">
                <button type="button" @click="updateFightDuration('addMin')" class="bg-black text-white leading-none md:text-3xl">+</button>
                <span class="md:text-2xl border-0 self-center text-center px-1 py-1" x-text="Math.floor(timeLeft / 600)"></span>
                <button type="button" @click="updateFightDuration('delMin')" class="bg-black text-white leading-none md:text-3xl">–</button>
              </div>
            </div>

            <div class="flex-1 grid gap-y-2">
              <label for="secondes" class="">Secondes</label>
              <div class="h-14 grid grid-cols-3 border border-black">
                <button type="button" @click="updateFightDuration('addSec')" class="bg-black text-white leading-none md:text-3xl">+</button>
                <span class="md:text-2xl self-center text-center px-1 py-1" x-text="(timeLeft % 600) / 10"></span>
                <button type="button" @click="updateFightDuration('delSec')" class="bg-black text-white leading-none md:text-3xl">–</button>
              </div>
            </div>
          </div>

          <h2 class="fs-modal-title mb-2 mt-8">Osaekomi</h2>
          <div class="flex flex-col sm:flex-row gap-x-6 gap-y-4">
            <div class="flex-1 grid gap-y-2">
              <label for="wazaari" class="">Waza-ari (sec)</label>
              <input value="" type="number" name="wazaari" id="wazaari" class="block w-full md:text-2xl" autocomplete="off" min="0" max="59">
            </div>
            <div class="flex-1 grid gap-y-2">
              <label for="ippon" class="">Ippon (sec)</label>
              <input value="" type="number" name="ippon" id="ippon" class="block w-full md:text-2xl" autocomplete="off" min="0" max="59">
            </div>
          </div>

          <h2 class="fs-modal-title mb-2 mt-8">Couleur accent</h2>
          <div class="flex flex-col sm:flex-row gap-x-6 gap-y-4">
            <div class="flex items-center gap-x-2 border rounded-sm px-4 py-2 border-gray-300 has-[:checked]:border-blue-500">
              <input type="radio" name="accentColor" id="bgRblue" value="blue" checked autocomplete="off" class="h-4 w-4 border-gray-300 text-blue-500 focus:ring-blue-500">
              <label for="bgRblue" class="text-blue-500">Bleu</label>
            </div>
            <div class="flex items-center gap-x-2 border rounded-sm px-4 py-2 border-gray-300 has-[:checked]:border-red-500">
              <input type="radio" name="accentColor" id="bgRed" value="red" autocomplete="off" class="h-4 w-4 border-gray-300 text-red-500 focus:ring-red-500">
              <label for="bgRed" class="text-red-500">Rouge</label>
            </div>
          </div>

          <div class="mt-12">
            <button type="submit" class="block w-full text-white bg-black py-2 px-4">Enregister</button>
          </div>
        </form>
      </div>
    </dialog>


  </div>
</body>

</html>
